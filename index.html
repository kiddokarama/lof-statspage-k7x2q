<head>

<title>League of Football</title>
<style>
:root{
 --bg:#f5f5f7;--card:#ffffff;--ink:#1d1d1f;--mute:#6e6e73;--line:#e5e5ea;--soft:#f2f2f7;
 --ac:#6b3fd4;--acbg:#efe9fc;--grn:#1f9d55;--grnbg:#dff5e8;--red:#d93a3f;--redbg:#fde6e6;--gold:#fff4c9;
 --hdr1:#2a0a3d;--hdr2:#4b1a6b;--shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(30,20,60,.06);
 --pitch1:#2f9e5b;--pitch2:#37ad66;--glass:rgba(245,245,247,.82)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#0d0d11;--card:#17171d;--ink:#f5f5f7;--mute:#9b9ba6;--line:#292933;--soft:#20202a;
 --ac:#b9a1ff;--acbg:#2a2144;--grn:#4ade80;--grnbg:#123324;--red:#ff7b80;--redbg:#3d1a1d;--gold:#3a331a;
 --hdr1:#1a0828;--hdr2:#34124d;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);
 --pitch1:#1e6a3f;--pitch2:#247a49;--glass:rgba(13,13,17,.82)}}
:root[data-theme="dark"]{
 --bg:#0d0d11;--card:#17171d;--ink:#f5f5f7;--mute:#9b9ba6;--line:#292933;--soft:#20202a;
 --ac:#b9a1ff;--acbg:#2a2144;--grn:#4ade80;--grnbg:#123324;--red:#ff7b80;--redbg:#3d1a1d;--gold:#3a331a;
 --hdr1:#1a0828;--hdr2:#34124d;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);
 --pitch1:#1e6a3f;--pitch2:#247a49;--glass:rgba(13,13,17,.82)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",system-ui,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
.wrap{max-width:980px;margin:0 auto;padding:0 16px 60px}
header{background:linear-gradient(135deg,var(--hdr1),var(--hdr2));color:#fff;padding:22px 0 16px}
header .wrap{padding-bottom:0}
.eyebrow{font-size:11px;letter-spacing:.18em;color:#7dffb8;font-weight:700}
h1{margin:4px 0 2px;font-size:30px;font-weight:800;letter-spacing:-.02em}
.sub{font-size:13px;color:#d6c9e6}
.topbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px}
select,button,input{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 11px}
button{cursor:pointer;transition:transform .12s,background .12s,border-color .12s}
button:hover{border-color:var(--ac)}button:active{transform:scale(.97)}
button:disabled{opacity:.4;cursor:default}
header select,header button{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.22);color:#fff}
header select option{color:#000}
.gwsel{display:flex;gap:6px;align-items:center}
.grow{flex:1}
nav{position:sticky;top:0;z-index:20;background:var(--glass);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;gap:2px;overflow-x:auto;padding-bottom:0;scrollbar-width:none}
nav button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;padding:13px 14px;color:var(--mute);font-weight:600;white-space:nowrap}
nav button:hover{color:var(--ink)}
nav button.on{color:var(--ink);border-bottom-color:var(--grn)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin:16px 0;box-shadow:var(--shadow)}
.card h2{margin:0 0 2px;font-size:19px;font-weight:700;letter-spacing:-.015em}
.hint{color:var(--mute);font-size:13px;margin:0 0 12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:16px 0}
.tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;text-align:center;box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.tile.lnk{cursor:pointer}.tile.lnk:hover{transform:translateY(-2px);border-color:var(--ac)}
.tile .l{font-size:11px;color:var(--mute);letter-spacing:.1em;font-weight:700}
.tile .v{font-size:34px;font-weight:800;color:var(--ac);line-height:1.15;letter-spacing:-.03em}
.tile .s{font-size:14px;font-weight:600}
.tile .go{font-size:11px;color:var(--ac);font-weight:600;margin-top:2px}
.dl{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
.dl .big{font-size:22px;font-weight:800;color:var(--ink);letter-spacing:-.02em}
.dl .lab{font-size:11px;letter-spacing:.1em;font-weight:700;color:var(--mute)}
.cd{display:flex;gap:8px}
.cd div{background:var(--soft);border-radius:12px;padding:8px 10px;text-align:center;min-width:58px}
.cd b{font-size:22px;display:block;font-variant-numeric:tabular-nums;line-height:1.2}.cd span{font-size:11px;color:var(--mute)}
.zgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin-top:14px}
.z{background:var(--soft);border-radius:10px;padding:6px 10px;display:flex;flex-direction:column;font-size:12px;color:var(--mute)}
.z b{font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse}
th{color:var(--mute);text-align:left;padding:8px;font-size:11px;letter-spacing:.06em;font-weight:700;text-transform:uppercase;white-space:nowrap;border-bottom:1px solid var(--line)}
th.s{cursor:pointer;user-select:none}th.s:hover{color:var(--ink)}
th.s.on{color:var(--ac)}
td{padding:9px 8px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
tr.lead td{background:var(--gold)}
tr.click{cursor:pointer;transition:background .12s}tr.click:hover td{background:var(--soft)}
.sm{font-size:12px;color:var(--mute)}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.up{background:var(--grnbg);color:var(--grn)}.dn{background:var(--redbg);color:var(--red)}.eq{background:var(--soft);color:var(--mute)}
.hit{color:var(--red);font-size:12px;font-weight:600}
.rk{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:var(--soft);font-weight:800;font-size:13px}
tr.lead .rk{background:#ffd54a;color:#4a3500}
.bar{background:var(--soft);border-radius:6px;height:10px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--grn);border-radius:6px}
.bar.r i{background:var(--red)}.bar.p i{background:var(--ac)}
.mini{display:flex;align-items:flex-end;gap:2px;height:26px}
.mini i{display:block;width:7px;background:var(--ac);border-radius:2px 2px 0 0;opacity:.55}
.mini i.last{background:var(--grn);opacity:1}
.row{display:grid;grid-template-columns:140px 1fr 120px;gap:10px;align-items:center;padding:6px 0;font-size:14px}
@media(max-width:560px){.row{grid-template-columns:96px 1fr 84px;font-size:13px}}
.sum{font-size:16px;line-height:1.55;margin:0 0 4px}
.quirks{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px;margin-top:12px}
.q{background:var(--soft);border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;font-size:14px}
.q .e{font-size:22px;line-height:1.2}.q b{display:block;font-size:12px;color:var(--mute);letter-spacing:.05em;text-transform:uppercase;margin-bottom:1px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{border:0;border-radius:0;padding:6px 12px;background:none}.seg button.on{background:var(--ac);color:#fff}
:root[data-theme="dark"] .seg button.on,:root:not([data-theme="light"]) .seg button.on{color:#10062a}
.ctl{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.pitch{background:repeating-linear-gradient(180deg,var(--pitch1) 0 52px,var(--pitch2) 52px 104px);border-radius:18px;padding:18px 6px 10px;color:#fff;position:relative;overflow:hidden}
.pitch::before{content:"";position:absolute;left:12%;right:12%;top:-1px;height:70px;border:2px solid rgba(255,255,255,.28);border-top:0;border-radius:0 0 12px 12px}
.pitch::after{content:"";position:absolute;left:36%;right:36%;top:-1px;height:30px;border:2px solid rgba(255,255,255,.28);border-top:0}
.prow{display:flex;justify-content:center;gap:10px;margin:0 0 20px;flex-wrap:wrap;position:relative;z-index:1}
.pl{width:92px;text-align:center;font-size:13px;position:relative}
.pl.hov{cursor:pointer;outline:none}
.pl .sh{width:54px;height:54px;margin:0 auto 4px;border-radius:50%;background:#fff;color:#2a0a3d;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:19px;position:relative;box-shadow:0 3px 8px rgba(0,0,0,.3);transition:transform .15s}
.pl.hov:hover .sh,.pl.hov:focus .sh{transform:scale(1.1)}
.pl .nm{background:rgba(10,10,20,.62);border-radius:8px;padding:2px 5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700;font-size:13px}
.pl .tm{display:inline-block;margin-top:3px;background:rgba(255,255,255,.92);color:#2a0a3d;font-size:11.5px;font-weight:800;letter-spacing:.04em;border-radius:999px;padding:1px 8px}
.pl .badge{position:absolute;top:-5px;right:-5px;background:#2a0a3d;color:#fff;border-radius:50%;width:22px;height:22px;font-size:11px;font-weight:800;line-height:22px;border:2px solid #fff}
.pl .badge.v{background:#666}
.pl .x{font-size:11px;font-weight:700;color:#cfffe3}
.pl.sub .sh{background:#ffe9a8}
.pl .own{font-size:11px;background:#7dffb8;color:#0c3320;border-radius:999px;padding:0 8px;display:inline-block;margin-top:3px;font-weight:800}
.bench{background:var(--soft);border-radius:14px;padding:10px;margin-top:12px;color:var(--ink)}
.bench .prow{margin-bottom:6px}
.bench .pl .nm{background:var(--card);color:var(--ink)}
.bench .pl .tm{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.bench .pl .sh{box-shadow:none;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.statg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.st{background:var(--soft);border-radius:14px;padding:12px}
.st .k{font-size:11px;color:var(--mute);letter-spacing:.06em;font-weight:700;text-transform:uppercase}
.st .v{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.st .s{font-size:12px;color:var(--mute)}
.gwstrip{display:flex;align-items:flex-end;gap:5px;height:84px;margin:10px 0 30px}
.gwstrip button{flex:1;border:0;padding:0;background:var(--ac);border-radius:6px 6px 0 0;position:relative;opacity:.4;min-width:14px;transition:opacity .15s}
.gwstrip button:hover{opacity:.75}
.gwstrip button.on{opacity:1;background:var(--grn)}
.gwstrip span{position:absolute;bottom:-20px;left:0;right:0;font-size:11px;color:var(--mute);text-align:center}
.gwstrip em{position:absolute;top:-17px;left:0;right:0;font-size:11px;font-style:normal;font-weight:700;color:var(--ink);text-align:center;opacity:0}
.gwstrip button:hover em,.gwstrip button.on em{opacity:1}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;margin:6px 0 4px}
.vs .p{text-align:center;padding:14px 8px;border-radius:16px;background:var(--soft)}
.vs .p.w{background:var(--acbg);outline:2px solid var(--ac)}
.vs .p .n{font-weight:700;font-size:14px}.vs .p .t{font-size:42px;font-weight:800;letter-spacing:-.03em;line-height:1.1;color:var(--ac)}
.vs .mid{font-weight:800;color:var(--mute)}
.stat{display:grid;grid-template-columns:1fr 150px 1fr;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.stat .a{text-align:right}.stat .a,.stat .b{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.stat .k{color:var(--mute);font-size:12px;text-align:center;font-weight:600}
.stat .w{color:var(--grn)}
.stat .a.t,.stat .b.t{font-size:13px;font-weight:500;color:var(--mute)}
@media(max-width:520px){.stat{grid-template-columns:1fr 96px 1fr}.stat .a,.stat .b{font-size:19px}}
.hgw{display:grid;grid-template-columns:34px 1fr 28px 1fr;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.hgw .n{font-weight:700;color:var(--mute)}
.hgw .c{display:flex;align-items:center;gap:8px}.hgw .c b{font-size:18px;min-width:34px;font-variant-numeric:tabular-nums}.hgw .c .bar{flex:1}
.hgw .m{text-align:center;color:var(--mute);font-weight:700}
.cols3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media(max-width:700px){.cols3{grid-template-columns:1fr}}
.cols3 .c{background:var(--soft);border-radius:14px;padding:12px}
.cols3 h3{margin:0 0 8px;font-size:14px}
.pr{display:flex;justify-content:space-between;align-items:center;font-size:15px;padding:4px 0}
.pr b{font-size:18px;font-variant-numeric:tabular-nums}
.pr.tot{border-top:1px solid var(--line);margin-top:4px;padding-top:8px}
.note{background:var(--acbg);border-radius:12px;padding:11px 14px;font-size:14px;margin:10px 0}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.legend button{padding:4px 11px;font-size:13px;border-radius:999px;border-width:2px}
.legend button.on{font-weight:700;opacity:1}
.pop{position:fixed;z-index:50;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.35);padding:12px 14px;max-width:290px;font-size:13px;pointer-events:none}
.pop h4{margin:0 0 2px;font-size:15px}
.pop .sm{margin-bottom:6px}
.pop ul{margin:0;padding:0;list-style:none}
.pop li{padding:2px 0}
.pop .bn{color:var(--mute)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--mute);font-size:12px}
.chart .nmlab{font-size:12px;font-weight:700}
.player{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.player .sc{flex:1;min-width:140px}
footer{text-align:center;color:var(--mute);font-size:12px;margin-top:30px}
.fade{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}}
</style>

(function(){
'use strict';
const M=D.mgr,PL=D.players,PTS=D.pts,LAST=D.last;

function readHash(){const p=new URLSearchParams(location.hash.slice(1));
 const g=+p.get('gw');if(g>=1&&g<=LAST)st.gw=g;
 if(TABS.some(t=>t[0]===p.get('tab')))st.tab=p.get('tab');
 if(p.get('m')&&M.some(x=>String(x.id)===p.get('m')))st.mgr=+p.get('m')}
function writeHash(){const p=new URLSearchParams();p.set('tab',st.tab);p.set('gw',st.gw);if(st.tab==='squads')p.set('m',st.mgr);
 try{history.replaceState(null,'','#'+p)}catch(e){}}
readHash();
// ---------- derived data
const byId=Object.fromEntries(M.map(m=>[m.id,m]));
const net=(m,g)=>{const r=m.gw[g];return r?r[0]-r[1]:null};
const tot=(m,g)=>{const r=m.gw[g];return r?r[4]:null};
function ranksAt(g){const l=M.filter(m=>m.gw[g]);const o={};l.forEach(m=>{o[m.id]=1+l.filter(z=>tot(z,g)>tot(m,g)).length});return o}
const isTie=(g,m)=>M.filter(z=>z.gw[g]&&tot(z,g)===tot(m,g)).length>1;
const RK={};for(let g=1;g<=LAST;g++)RK[g]=ranksAt(g);
function xi(m,g){
 const pk=m.picks[g];if(!pk)return null;
 const out=new Set(pk.subs.map(s=>s[1])),inn=new Set(pk.subs.map(s=>s[0]));
 const x=[],b=[];
 pk.p.slice().sort((a,c)=>a[1]-c[1]).forEach(([id,pos,mult,cap,vc])=>{
  const started=pos<=11,subIn=inn.has(id),subOut=out.has(id);
  const e={id,pos,mult,cap:!!cap,vc:!!vc,subIn,subOut,pts:(PTS[g]||{})[id]||0};
  if((started&&!subOut)||subIn){if(subIn&&e.mult===0)e.mult=1;x.push(e)}else b.push(e)});
 if(!x.some(e=>e.cap)){const t=x.find(e=>e.mult>1);if(t){t.cap=true;t.vc=false}}
 return {x,b,chip:pk.chip};
}

const pt=id=>PL[id]?PL[id][2]:0;

 return {gws,scores,hitsGw,hitPts,trn,bench,wins,caps,capTot,bestCap,fav,cnt,contrib,starts,topc,first,cur,bestRank,chips,
  avg:avg(scores),best:Math.max(...scores),worst:Math.min(...scores)};
}
function squads(){
 const m=byId[st.mgr],g=st.gw;
 let h=`<div class="card"><h2>👕 Squads</h2><p class="hint">Pick a manager, then tap a bar to jump to any gameweek and have a nosy.</p><div class="ctl">${mgrSelect('sm',st.mgr)}</div>`;
 const gws=Object.keys(m.gw).map(Number).sort((a,b)=>a-b);
 const mx=Math.max(...gws.map(x=>net(m,x)));
 h+=`<div class="gwstrip">${gws.map(x=>`<button data-g="${x}" class="${x===g?'on':''}" title="GW${x}: ${net(m,x)}" style="height:${Math.max(8,Math.round(net(m,x)/mx*84))}px"><em>${net(m,x)}</em><span>${x}</span></button>`).join('')}</div></div>`;
 if(!m.picks[g])return h+`<div class="card"><p>${mname(m)} has no squad for this gameweek. Hadn't joined yet. Fashionably late.</p></div>`;
 const x=xi(m,g),r=m.gw[g];
 const gwMax=Math.max(...M.filter(z=>z.gw[g]).map(z=>net(z,g)));
 h+=`<div class="tiles"><div class="tile"><div class="l">GW${g} POINTS</div><div class="v">${net(m,g)}</div><div class="s">${net(m,g)===gwMax?'👑 GW winner':(r[1]?`after a -${r[1]} hit`:'no hit')}</div></div>
 <div class="tile"><div class="l">LEAGUE POSITION</div><div class="v">${RK[g][m.id]}</div><div class="s">${tot(m,g)} pts total</div></div>
 <div class="tile"><div class="l">SQUAD VALUE</div><div class="v">£${(r[5]/10).toFixed(1)}m</div><div class="s">bank £${(r[6]/10).toFixed(1)}m</div></div></div>`;
 h+=`<div class="card"><h2>${mname(m)} <span class="sm">· ${esc(m.team)}</span></h2><p class="hint">${x.chip?`Chip played: <b>${chipName(x.chip)}</b> · `:''}${r[3]} transfer${r[3]===1?'':'s'} this week · ${x.chip==='bboost'?'all 15 players counted (Bench Boost)':r[2]+' points left on the bench'}. The captain badge is C, vice-captain V.</p>`;
 h+=pitchHtml(x.x)+`<div class="bench"><div class="sm" style="padding:2px 8px;font-weight:700;letter-spacing:.08em">BENCH</div><div class="prow">${x.b.map(e=>playerHtml(Object.assign({},e,{mult:1}))).join('')}</div></div></div>`;
 const S=seasonStats(m,g);
 const vc=(S.cur[5]-S.first[5])/10;
 h+=`<div class="card"><h2>📈 ${mname(m)} · season to GW${g}</h2><p class="hint">Gameweek 1 to ${g}. No excuses.</p><div class="statg" id="sstats">
 ${stc('Transfers made',S.trn,`${(S.trn/S.gws.length).toFixed(1)} per gameweek`)}
 ${stc('Hits taken',S.hitsGw.length,`${S.hitPts} points lost`)}
 ${stc('Average GW score',S.avg.toFixed(1),`best ${S.best} · worst ${S.worst}`)}
 ${stc('Gameweeks won',S.wins,`of ${S.gws.length} played`)}
 ${stc('Points left on bench',S.bench,`Bench Boost weeks excluded`)}
 ${stc('Captain points',S.capTot,S.bestCap?`best: ${esc(nm(S.bestCap.c.id))} in GW${S.bestCap.g} (${S.bestCap.p})`:'')}
 ${stc('Favourite captain',S.fav!==undefined?esc(nm(S.fav)):'–',S.fav!==undefined?`${S.cnt[S.fav]} time${S.cnt[S.fav]>1?'s':''}`:'')}
 ${stc('Best league position',S.bestRank+ord(S.bestRank),`now ${RK[g][m.id]}${ord(RK[g][m.id])}`)}
 ${stc('Squad value change',(vc>=0?'+':'')+'£'+vc.toFixed(1)+'m',`since GW${S.gws[0]}`)}
 ${stc('Chips used',S.chips.length,S.chips.join(', ')||'none yet')}
 </div></div>
 <div class="card"><h2>🏆 Top earners</h2><p class="hint">Who has been paying ${mname(m)}'s bills: points scored while in his starting XI, captain bonus included.</p><div class="tw"><table id="earners"><tr><th>Player</th><th>Points</th><th>Starts</th></tr>${S.topc.map(id=>`<tr><td><b>${esc(nm(id))}</b> <span class="sm">${esc(tm(id))}</span></td><td><b>${S.contrib[id]}</b></td><td>${S.starts[id]}</td></tr>`).join('')}</table></div></div>`;
 return h;
}
function stc(k,v,s){return `<div class="st"><div class="k">${k}</div><div class="v">${v}</div><div class="s">${s||'&nbsp;'}</div></div>`}
// ---------- head to head
function h2h(){
 if(!st.a)st.a=M[0].id;if(!st.b)st.b=M[1].id;
 const A=byId[st.a],B=byId[st.b],g=st.gw;
 let h=`<div class="card"><h2>⚔️ Head-to-head</h2><p class="hint">Pick two managers and settle it. Season to Gameweek ${g}, plus their squads that week.</p>
 <div class="ctl">${mgrSelect('ha',st.a)} <b>vs</b> ${mgrSelect('hb',st.b)}</div></div>`;
 if(A.id===B.id)return h+'<div class="card"><p>Pick two different managers. Fighting yourself is a different sport.</p></div>';
 const gw=[];for(let i=1;i<=g;i++)if(A.gw[i]&&B.gw[i])gw.push(i);
 const sA=gw.map(i=>net(A,i)),sB=gw.map(i=>net(B,i));
 const winA=gw.filter((i,k)=>sA[k]>sB[k]).length,winB=gw.filter((i,k)=>sB[k]>sA[k]).length,draw=gw.length-winA-winB;
 const sum=a=>a.reduce((x,y)=>x+y,0);
 const hits=m=>gw.reduce((a,i)=>a+m.gw[i][1],0),bench=m=>gw.reduce((a,i)=>a+(m.picks[i]&&m.picks[i].chip==='bboost'?0:m.gw[i][2]),0);
 const trans=m=>gw.reduce((a,i)=>a+m.gw[i][3],0);
 const chipsUsed=m=>m.chips.filter(c=>c[1]<=g).map(c=>chipName(c[0])+' (GW'+c[1]+')').join(', ')||'none';
 const capP=m=>gw.reduce((a,i)=>{const c=capOf(m,i);return a+(c?tp(c):0)},0);
 const row=(k,a,b,hi)=>{const num=typeof a==='number'||/^[\d.]+$/.test(String(a));let w='';if(num){const x=+a,y=+b;w=hi==='low'?(x<y?'a':x>y?'b':''):(x>y?'a':x<y?'b':'')}
  return `<div class="stat"><div class="a ${w==='a'?'w':''}">${a}</div><div class="k">${k}</div><div class="b ${w==='b'?'w':''}">${b}</div></div>`};
 const tA=sum(sA),tB=sum(sB);
 h+=`<div class="card"><div class="vs"><div class="p ${tA>tB?'w':''}"><div class="n">${mname(A)}</div><div class="t" id="h2hA">${tA}</div><div class="sm">points</div></div><div class="mid">VS</div><div class="p ${tB>tA?'w':''}"><div class="n">${mname(B)}</div><div class="t" id="h2hB">${tB}</div><div class="sm">points</div></div></div>
 <p class="hint" style="text-align:center;margin-top:8px">${tA===tB?'Level on points':`${esc(tA>tB?A.name:B.name)} leads by <b>${Math.abs(tA-tB)}</b>`} across ${gw.length} shared gameweeks · ${winA}–${winB}${draw?` (${draw} drawn)`:''} on gameweek wins</p>
 ${row('Gameweeks won',winA,winB)}
 ${row('Average per GW',(tA/gw.length).toFixed(1),(tB/gw.length).toFixed(1))}
 ${row('Best GW',Math.max(...sA),Math.max(...sB))}
 ${row('Worst GW',Math.min(...sA),Math.min(...sB))}
 ${row('Transfers made',trans(A),trans(B),'none')}
 ${row('Points lost to hits',hits(A),hits(B),'low')}
 ${row('Bench points',bench(A),bench(B),'low')}
 ${row('Captain points',capP(A),capP(B))}
 <div class="stat"><div class="a t">${esc(chipsUsed(A))}</div><div class="k">Chips used</div><div class="b t" style="text-align:left">${esc(chipsUsed(B))}</div></div></div>`;
 const mx=Math.max(...sA,...sB);
 h+=`<div class="card"><h2>Gameweek by gameweek</h2><p class="hint">Green means you won the week. Purple means you did not.</p>${gw.map((i,k)=>`<div class="hgw"><div class="n">${i}</div><div class="c"><b>${sA[k]}</b>${bar(sA[k],mx,sA[k]>=sB[k]?'':'p')}</div><div class="m">${sA[k]>sB[k]?'◀':sA[k]<sB[k]?'▶':'='}</div><div class="c"><b>${sB[k]}</b>${bar(sB[k],mx,sB[k]>=sA[k]?'':'p')}</div></div>`).join('')}</div>`;
 const xa=A.picks[g]&&xi(A,g),xb=B.picks[g]&&xi(B,g);
 if(xa&&xb){
  const ia=new Map(xa.x.map(e=>[e.id,e])),ib=new Map(xb.x.map(e=>[e.id,e]));
  const onlyA=xa.x.filter(e=>!ib.has(e.id)),onlyB=xb.x.filter(e=>!ia.has(e.id)),both=xa.x.filter(e=>ib.has(e.id));
  const list=(a)=>a.slice().sort((p,q)=>tp(q)-tp(p)).map(e=>`<div class="pr"><span>${esc(nm(e.id))}${e.cap?' <span class="sm">(C)</span>':''} <span class="sm">${esc(tm(e.id))}</span></span><b>${tp(e)}</b></div>`).join('')||'<div class="sm">none</div>';
  const sa=onlyA.reduce((a,e)=>a+tp(e),0),sb=onlyB.reduce((a,e)=>a+tp(e),0);
  h+=`<div class="card"><h2>Squads in GW${g}</h2><p class="hint">Starting XIs compared. Shared players cancel out, so the differentials decide who gained. Points include captaincy.</p>
  <div class="cols3"><div class="c"><h3>Only ${mname(A)} (${onlyA.length})</h3>${list(onlyA)}<div class="pr tot"><span>Differential points</span><b id="dA">${sa}</b></div></div>
  <div class="c"><h3>Shared (${both.length})</h3>${list(both)}</div>
  <div class="c"><h3>Only ${mname(B)} (${onlyB.length})</h3>${list(onlyB)}<div class="pr tot"><span>Differential points</span><b id="dB">${sb}</b></div></div></div>
  <div class="note">${sa===sb?'The differentials cancelled out. How polite.':`Differentials gave <b>${esc(sa>sb?A.name:B.name)}</b> a ${Math.abs(sa-sb)}-point edge in GW${g}.`}</div></div>`;
 }
 return h;
}
// ---------- rank race (animated)
let raf=null,last=0;
const BASE=['#ff3b30','#2fc65a','#2f8bff','#ffb000','#b45cf0','#00c2d1','#ff4fa3'];
const DASH=['','9 5','2 5'];
const colr=m=>BASE[M.indexOf(m)%7];
const dsh=m=>DASH[Math.floor(M.indexOf(m)/7)%3];
const shp=m=>Math.floor(M.indexOf(m)/7)%3;
const swatch=m=>`<svg width="26" height="8" viewBox="0 0 26 8" style="vertical-align:middle;margin-right:6px"><line x1="1" x2="25" y1="4" y2="4" stroke="${colr(m)}" stroke-width="3" stroke-linecap="round" ${dsh(m)?`stroke-dasharray="${dsh(m)}"`:''}/></svg>`;
function rankView(){
 if(!st.rank)st.rank=M.slice().sort((a,b)=>RK[LAST][a.id]-RK[LAST][b.id]).slice(0,4).map(m=>m.id);
 return `<div class="card"><h2>🏁 Rank race</h2><p class="hint">Pick your favourites and press play to watch the league table do its thing, from Gameweek 1 to ${LAST}. Sit back, this is the good bit.</p>
 <div class="player"><button id="rplay" style="min-width:92px">${st.play?'⏸ Pause':'▶ Play'}</button><button id="rrestart">↺ Restart</button><input id="rscrub" class="sc" type="range" min="1" max="${LAST}" step="0.01" value="${st.rp}" aria-label="Gameweek"><select id="rspeed"><option value="0.5">Slower</option><option value="1">Normal</option><option value="2">Faster</option></select><b id="rgw" style="min-width:90px;text-align:right"></b></div>
 <div id="rchart"></div>
 <div class="legend" id="rleg">${M.slice().sort((a,b)=>RK[LAST][a.id]-RK[LAST][b.id]).map(m=>`<button data-r="${m.id}" class="${st.rank.includes(m.id)?'on':''}" style="${st.rank.includes(m.id)?`background:var(--soft);border-color:${colr(m)}`:'opacity:.75'}">${swatch(m)}${mname(m)}</button>`).join('')}</div>
 <button id="rall">Everyone</button> <button id="rtop">Top 4</button> <button id="rnone">Clear</button></div>
 <div class="card" id="rnow"></div>`;
}
function drawRank(){
 const n=M.length,W=640,H=400,pl=34,pr=120,pt0=14,pb=28,p=st.rp;
 const x=i=>pl+(i-1)/Math.max(1,LAST-1)*(W-pl-pr),y=r=>pt0+(r-1)/(n-1)*(H-pt0-pb);
 const g0=Math.floor(p+1e-9);
 const at=(m,i)=>RK[i][m.id];
 let svg=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Rank race chart">`;
 for(let r=1;r<=n;r+=(n>12?4:1)){svg+=`<line x1="${pl}" x2="${W-pr}" y1="${y(r)}" y2="${y(r)}" stroke="var(--line)"/><text x="4" y="${y(r)+4}">${r}</text>`}
 for(let i=1;i<=LAST;i++)svg+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${i}</text>`;
 svg+=`<line x1="${x(p)}" x2="${x(p)}" y1="${pt0}" y2="${H-pb}" stroke="var(--ac)" stroke-dasharray="4 4" opacity=".5"/>`;
 const heads=[];
 M.forEach(m=>{const on=st.rank.includes(m.id);if(!on)return;
  const pts=[];for(let i=1;i<=g0;i++)if(RK[i][m.id])pts.push([x(i),y(at(m,i)),i]);
  if(!pts.length)return;
  let hx=pts[pts.length-1][0],hy=pts[pts.length-1][1];
  if(g0<LAST&&RK[g0+1][m.id]&&RK[g0][m.id]){const f=p-g0;const nx=x(g0+1),ny=y(at(m,g0+1));hx=x(g0)+(nx-x(g0))*f;hy=y(at(m,g0))+(ny-y(at(m,g0)))*f;pts.push([hx,hy,p])}
  svg+=`<polyline fill="none" stroke="${colr(m)}" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round" ${dsh(m)?`stroke-dasharray="${dsh(m)}"`:''} points="${pts.map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' ')}"/>`;
  heads.push({m,hx,hy})});
 // stagger labels
 heads.sort((a,b)=>a.hy-b.hy);let prev=-99;
 heads.forEach(hd=>{let ly=Math.max(hd.hy,prev+14);prev=ly;
  const cx=hd.hx.toFixed(1),cy=hd.hy.toFixed(1),k=shp(hd.m);
  svg+=(k===0?`<circle cx="${cx}" cy="${cy}" r="5.5" fill="${colr(hd.m)}" stroke="var(--card)" stroke-width="2"/>`:k===1?`<rect x="${(hd.hx-5).toFixed(1)}" y="${(hd.hy-5).toFixed(1)}" width="10" height="10" fill="${colr(hd.m)}" stroke="var(--card)" stroke-width="2"/>`:`<polygon points="${cx},${(hd.hy-7).toFixed(1)} ${(hd.hx+6).toFixed(1)},${(hd.hy+5).toFixed(1)} ${(hd.hx-6).toFixed(1)},${(hd.hy+5).toFixed(1)}" fill="${colr(hd.m)}" stroke="var(--card)" stroke-width="2"/>`)+`<text class="nmlab" x="${(hd.hx+9).toFixed(1)}" y="${(ly+4).toFixed(1)}" style="fill:${colr(hd.m)}">${esc(shortLab(hd.m))}</text>`});
 svg+='</svg>';
 $('#rchart').innerHTML=svg;
 const gShow=Math.min(LAST,Math.max(1,Math.round(p)));
 $('#rgw').textContent='Gameweek '+gShow;
 const sc=$('#rscrub');if(sc&&document.activeElement!==sc)sc.value=p;
 const now=st.rank.map(id=>byId[id]).filter(m=>RK[gShow][m.id]).sort((a,b)=>RK[gShow][a.id]-RK[gShow][b.id]||a.name.localeCompare(b.name));
 $('#rnow').innerHTML=`<h2>Standings after GW${gShow}</h2><div class="tw"><table id="rnowT"><tr><th>#</th><th>Manager</th><th>Total</th></tr>${now.map(m=>`<tr><td><span class="rk">${RK[gShow][m.id]}</span></td><td><b>${mname(m)}</b></td><td>${tot(m,gShow)}</td></tr>`).join('')||'<tr><td colspan="3" class="sm">Pick a manager above.</td></tr>'}</table></div>`;
}
function shortLab(m){const p=m.name.split(' ');return p.length>1?p[0]+' '+p[p.length-1][0]+'.':p[0]}
function stopAnim(){st.play=false;if(raf)cancelAnimationFrame(raf);raf=null;const b=$('#rplay');if(b)b.textContent='▶ Play'}
function startAnim(){
 if(st.rp>=LAST-0.001)st.rp=1;st.play=true;last=0;
 const b=$('#rplay');if(b)b.textContent='⏸ Pause';
 const step=ts=>{if(!st.play)return;if(!last)last=ts;const dt=(ts-last)/1000;last=ts;
  st.rp=Math.min(LAST,st.rp+dt*st.speed*0.5);drawRank();
  if(st.rp>=LAST){stopAnim();return}
  raf=requestAnimationFrame(step)};
 raf=requestAnimationFrame(step);
}
function wireRank(){
 $('#rplay').onclick=()=>{st.play?stopAnim():startAnim()};
 $('#rrestart').onclick=()=>{stopAnim();st.rp=1;drawRank();startAnim()};
 $('#rscrub').oninput=e=>{stopAnim();st.rp=+e.target.value;drawRank()};
 $('#rspeed').value=String(st.speed);$('#rspeed').onchange=e=>{st.speed=+e.target.value};
 const legendRefresh=()=>{$('#rleg').querySelectorAll('button').forEach(b=>{const m=byId[b.dataset.r],on=st.rank.includes(m.id);b.className=on?'on':'';b.style.background=on?'var(--soft)':'';b.style.opacity=on?'':'.75';b.style.borderColor=on?colr(m):''})};
 $('#rleg').onclick=e=>{const b=e.target.closest('button');if(!b)return;const id=+b.dataset.r;st.rank=st.rank.includes(id)?st.rank.filter(x=>x!==id):st.rank.concat(id);legendRefresh();drawRank()};
 $('#rall').onclick=()=>{st.rank=M.map(m=>m.id);legendRefresh();drawRank()};
 $('#rtop').onclick=()=>{st.rank=M.slice().sort((a,b)=>RK[LAST][a.id]-RK[LAST][b.id]).slice(0,4).map(m=>m.id);legendRefresh();drawRank()};
 $('#rnone').onclick=()=>{st.rank=[];legendRefresh();drawRank()};
 drawRank();
}
// ---------- render
function render(){
 clearInterval(timer);if(st.tab!=='rank')stopAnim();hidePop();
 syncGw();writeHash();
 document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===st.tab));
 const app=$('#app');
 const v={overview,totw:totwView,squads,h2h,rank:rankView}[st.tab]||overview;
 app.innerHTML='<div class="fade">'+v()+'</div>';
 if(st.tab==='overview'||st.tab==='totw')wireDeadline();
 app.querySelectorAll('tr[data-m]').forEach(r=>r.onclick=()=>goSquad(+r.dataset.m));
 app.querySelectorAll('.tile[data-go]').forEach(t=>t.onclick=()=>goSquad(+t.dataset.go));
 const w=$('#win');if(w)w.onclick=e=>{const b=e.target.closest('button');if(b){st.win=+b.dataset.w;render()}};
 app.querySelectorAll('th[data-s]').forEach(t=>t.onclick=()=>{const k=t.dataset.s;if(st.sort.k===k)st.sort.rev=!st.sort.rev;else st.sort={k,rev:false};render()});
 const ss=$('#sortsel');if(ss)ss.onchange=()=>{st.sort={k:ss.value,rev:false};render()};
 const sr=$('#sortrev');if(sr)sr.onclick=()=>{st.sort.rev=!st.sort.rev;render()};
 const sm=$('#sm');if(sm)sm.onchange=()=>{st.mgr=+sm.value;render()};
 app.querySelectorAll('.gwstrip button').forEach(b=>b.onclick=()=>{st.gw=+b.dataset.g;render()});
 const ha=$('#ha'),hb=$('#hb');if(ha){ha.onchange=()=>{st.a=+ha.value;render()};hb.onchange=()=>{st.b=+hb.value;render()}}
 if(st.tab==='totw')wirePop();
 if(st.tab==='rank')wireRank();
}
window.addEventListener('hashchange',()=>{readHash();render()});
window.__LOF={st,RK,xi,totw,gwSummary,seasonStats,net,tot,fmtDeadline};
render();
})();
