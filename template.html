<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light dark">
<title>League of Football</title>
<style>
:root{
 --bg:#f6f7f9;--card:#ffffff;--ink:#0f1115;--mute:#667085;--line:#e6e8ec;--soft:#f2f4f7;
 --ac:#047857;--acbg:#e6f6ef;--grn:#059669;--grnbg:#e3f6ee;--red:#dc2626;--redbg:#fdecec;--gold:#f0faf5;
 --amb:#b45309;--ambbg:#fdf3e1;--pitch1:#2f8f56;--pitch2:#2c8450;--glass:rgba(246,247,249,.86);--hdr:#ffffff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#0a0b0e;--card:#111318;--ink:#e9ebef;--mute:#8a92a0;--line:#1f232b;--soft:#171a20;
 --ac:#6ee7b7;--acbg:#10231c;--grn:#34d399;--grnbg:#0f2a21;--red:#f87171;--redbg:#2a1416;--gold:#0f1d17;
 --amb:#fbbf24;--ambbg:#2a2110;--pitch1:#143322;--pitch2:#12301f;--glass:rgba(10,11,14,.86);--hdr:#0a0b0e}}
:root[data-theme="dark"]{
 --bg:#0a0b0e;--card:#111318;--ink:#e9ebef;--mute:#8a92a0;--line:#1f232b;--soft:#171a20;
 --ac:#6ee7b7;--acbg:#10231c;--grn:#34d399;--grnbg:#0f2a21;--red:#f87171;--redbg:#2a1416;--gold:#0f1d17;
 --amb:#fbbf24;--ambbg:#2a2110;--pitch1:#143322;--pitch2:#12301f;--glass:rgba(10,11,14,.86);--hdr:#0a0b0e}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",system-ui,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.006em;font-variant-numeric:tabular-nums}
.wrap{max-width:980px;margin:0 auto;padding:0 16px 56px}
header{background:var(--hdr);border-bottom:1px solid var(--line);padding:20px 0 14px}
header .wrap{padding-bottom:0}
.eyebrow{font-size:11px;letter-spacing:.16em;color:var(--ac);font-weight:600;text-transform:uppercase}
h1{margin:4px 0 2px;font-size:26px;font-weight:700;letter-spacing:-.025em}
.sub{font-size:13px;color:var(--mute)}
.topbar{display:flex;gap:8px;align-items:center;margin-top:14px}
select,button,input{font:inherit;font-size:14px;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:9px;padding:7px 11px}
select{padding-right:8px}
button{cursor:pointer;transition:background .12s,border-color .12s,color .12s}
button:hover{border-color:var(--mute)}button:active{transform:scale(.98)}
button:disabled{opacity:.35;cursor:default}
.gwsel{display:flex;gap:6px;align-items:center;min-width:0}
.gwsel select{min-width:0;max-width:62vw;text-overflow:ellipsis}
.grow{flex:1}
.ibtn{width:34px;height:34px;padding:0;display:inline-flex;align-items:center;justify-content:center}
.ibtn svg{width:16px;height:16px}
nav{position:sticky;top:0;z-index:20;background:var(--glass);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;gap:4px;overflow-x:auto;padding-bottom:0;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent)}
nav .wrap::-webkit-scrollbar{display:none}
nav button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;padding:13px 10px;color:var(--mute);font-weight:500;font-size:14px;white-space:nowrap}
nav button:hover{color:var(--ink)}
nav button.on{color:var(--ink);font-weight:600;border-bottom-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}
.card h2{margin:0 0 3px;font-size:16px;font-weight:650;letter-spacing:-.015em}
.card h2.cap{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);font-weight:600}
.hint{color:var(--mute);font-size:13px;margin:0 0 12px;line-height:1.45}
.note{border:1px solid var(--line);border-left:3px solid var(--ac);background:var(--card);border-radius:10px;padding:11px 14px;margin:14px 0;font-size:13.5px;line-height:1.45;color:var(--ink)}
.note.live{border-left-color:var(--amb);background:var(--ambbg)}.note.dbl{border-left-color:var(--ac)}.note.blank{border-left-color:var(--mute)}
.note b{margin-right:3px}
.card .note{background:var(--soft);border-color:var(--line)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
@media(max-width:620px){.tiles{grid-template-columns:1fr 1fr}.tiles>.tile:nth-child(odd):last-child{grid-column:1/-1}}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;transition:border-color .15s}
.tile.lnk{cursor:pointer}.tile.lnk:hover{border-color:var(--ac)}
.tile .l{font-size:11px;color:var(--mute);letter-spacing:.08em;font-weight:600;text-transform:uppercase}
.tile .v{font-size:30px;font-weight:700;color:var(--ink);line-height:1.15;letter-spacing:-.03em;margin:2px 0}
.tile .s{font-size:13px;color:var(--mute);line-height:1.35}
.tile .go{font-size:12px;color:var(--ac);font-weight:600;margin-top:6px}
.dl{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
.dl .big{font-size:20px;font-weight:700;letter-spacing:-.02em}
.dl .lab{font-size:11px;letter-spacing:.1em;font-weight:600;color:var(--mute)}
.cd{display:flex;gap:6px}
.cd div{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:6px 8px;text-align:center;min-width:54px}
.cd b{font-size:20px;display:block;line-height:1.2}.cd span{font-size:10.5px;color:var(--mute)}
.zgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:6px;margin-top:14px}
@media(max-width:520px){.zgrid{grid-template-columns:1fr 1fr}}
.z{background:var(--soft);border-radius:9px;padding:7px 10px;display:flex;flex-direction:column;font-size:12px;color:var(--mute)}
.z b{font-size:15px;color:var(--ink);font-weight:600}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse}
th{color:var(--mute);text-align:left;padding:8px;font-size:11px;letter-spacing:.07em;font-weight:600;text-transform:uppercase;white-space:nowrap;border-bottom:1px solid var(--line)}
th.s{cursor:pointer;user-select:none}th.s:hover{color:var(--ink)}
th.s.on{color:var(--ac)}
td{padding:9px 8px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.lead td{background:var(--gold)}
tr.click{cursor:pointer;transition:background .12s}tr.click:hover td{background:var(--soft)}
#tbl th:first-child,#tbl td:first-child{position:sticky;left:0;z-index:1;background:var(--card)}
#tbl th:nth-child(2),#tbl td:nth-child(2){position:sticky;left:46px;z-index:1;background:var(--card);min-width:128px;box-shadow:1px 0 0 var(--line)}
#tbl tr.lead td:first-child,#tbl tr.lead td:nth-child(2){background:var(--gold)}
#tbl tr.click:hover td:first-child,#tbl tr.click:hover td:nth-child(2){background:var(--soft)}
.sm{font-size:12px;color:var(--mute)}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.up{background:var(--grnbg);color:var(--grn)}.dn{background:var(--redbg);color:var(--red)}.eq{background:var(--soft);color:var(--mute)}
.hit{color:var(--red);font-size:12px;font-weight:600}
.rk{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;border-radius:7px;background:var(--soft);font-weight:700;font-size:12.5px;color:var(--ink)}
tr.lead .rk,.crow.lead .rk{background:var(--ac);color:var(--bg)}
.bar{background:var(--soft);border-radius:4px;height:8px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--grn);border-radius:4px}
.bar.r i{background:var(--red)}.bar.p i{background:var(--mute)}
.mini{display:flex;align-items:flex-end;gap:2px;height:24px}
.mini i{display:block;width:6px;background:var(--mute);border-radius:2px 2px 0 0;opacity:.45}
.mini i.last{background:var(--ac);opacity:1}
.row{display:grid;grid-template-columns:140px 1fr 110px;gap:10px;align-items:center;padding:6px 0;font-size:14px}
@media(max-width:560px){.row{grid-template-columns:92px 1fr 78px;font-size:13px}}
.sum{font-size:15.5px;line-height:1.55;margin:0 0 4px}
.quirks{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:8px;margin-top:12px}
.q{background:var(--soft);border-radius:11px;padding:11px 13px;display:flex;gap:10px;align-items:flex-start;font-size:13.5px;line-height:1.45}
.q .e{font-size:18px;line-height:1.3;width:22px;text-align:center;flex:none}.q b{display:block;font-size:11px;color:var(--mute);letter-spacing:.07em;text-transform:uppercase;margin-bottom:1px;font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--soft)}
.seg button{border:0;border-radius:0;padding:6px 12px;background:none;font-size:13px;color:var(--mute);font-weight:500}.seg button.on{background:var(--ac);color:var(--bg);font-weight:600}
.ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.ctl label{display:flex;align-items:center;gap:6px}
.pitch{background:repeating-linear-gradient(180deg,var(--pitch1) 0 48px,var(--pitch2) 48px 96px);border-radius:12px;padding:16px 4px 6px;color:#fff;position:relative;overflow:hidden;border:1px solid var(--line)}
.pitch::before{content:"";position:absolute;left:14%;right:14%;top:-1px;height:64px;border:1.5px solid rgba(255,255,255,.14);border-top:0;border-radius:0 0 10px 10px}
.pitch::after{content:"";position:absolute;left:37%;right:37%;top:-1px;height:26px;border:1.5px solid rgba(255,255,255,.14);border-top:0}
.prow{display:flex;justify-content:center;gap:6px;margin:0 0 16px;flex-wrap:wrap;position:relative;z-index:1}
.pl{width:84px;text-align:center;font-size:12px;position:relative}
.pl.hov{cursor:pointer;outline:none}
.pl .sh{width:46px;height:46px;margin:0 auto 4px;border-radius:50%;background:#fff;color:#0a0b0e;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;position:relative;box-shadow:0 2px 6px rgba(0,0,0,.35);transition:transform .15s}
.pl.hov:hover .sh,.pl.hov:focus .sh{transform:scale(1.08)}
.pl .nm{background:rgba(6,8,12,.7);border-radius:6px;padding:2px 4px;font-weight:600;font-size:11.5px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .tm{display:inline-block;margin-top:3px;color:rgba(255,255,255,.8);font-size:10.5px;font-weight:600;letter-spacing:.05em}
.pl .badge{position:absolute;top:-4px;right:-4px;background:#0a0b0e;color:#fff;border-radius:50%;width:19px;height:19px;font-size:10px;font-weight:700;line-height:17px;border:1.5px solid #fff}
.pl .badge.v{background:#5b6270}
.pl .x{font-size:10.5px;font-weight:600;color:#bff3da}
.pl.sub .sh{background:#fde68a}
.pl .own{font-size:11px;background:#6ee7b7;color:#04261a;border-radius:999px;padding:0 8px;display:inline-block;margin-top:3px;font-weight:700}
@media(max-width:520px){.pl{width:62px}.pl .sh{width:40px;height:40px;font-size:15px}.pl .nm{font-size:10.5px;padding:2px 1px}.pl .nm.lg{font-size:9px}.pl .tm{font-size:10px}.prow{gap:4px}.pl .x{font-size:9.5px}}
.bench{background:var(--soft);border-radius:12px;padding:10px 6px 4px;margin-top:12px;color:var(--ink)}
.bench .prow{margin-bottom:8px}
.bench .pl .nm{background:var(--card);color:var(--ink)}
.bench .pl .tm{color:var(--mute)}
.bench .pl .sh{box-shadow:none;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.statg{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
@media(max-width:520px){.statg{grid-template-columns:1fr 1fr}}
.st{background:var(--soft);border-radius:11px;padding:11px 12px}
.st .k{font-size:10.5px;color:var(--mute);letter-spacing:.07em;font-weight:600;text-transform:uppercase}
.st .v{font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.25}
.st .s{font-size:12px;color:var(--mute);line-height:1.35}
.gwstrip{display:flex;align-items:flex-end;gap:4px;height:84px;margin:12px 0 28px}
.gwstrip button{flex:1;border:0;padding:0;background:var(--mute);border-radius:4px 4px 0 0;position:relative;opacity:.35;min-width:12px;transition:opacity .15s}
.gwstrip button:hover{opacity:.7}
.gwstrip button.on{opacity:1;background:var(--ac)}
.gwstrip span{position:absolute;bottom:-19px;left:0;right:0;font-size:11px;color:var(--mute);text-align:center}
.gwstrip em{position:absolute;top:-17px;left:0;right:0;font-size:11px;font-style:normal;font-weight:600;color:var(--ink);text-align:center;opacity:0}
.gwstrip button:hover em,.gwstrip button.on em{opacity:1}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin:4px 0}
.vs .p{text-align:center;padding:14px 6px;border-radius:12px;background:var(--soft);border:1px solid transparent;min-width:0}
.vs .p.w{border-color:var(--ac);background:var(--acbg)}
.vs .p .n{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.vs .p .t{font-size:38px;font-weight:700;letter-spacing:-.035em;line-height:1.1}
.vs .mid{font-weight:600;color:var(--mute);font-size:12px;letter-spacing:.1em}
.stat{display:grid;grid-template-columns:1fr 130px 1fr;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.stat .a{text-align:right}.stat .a,.stat .b{font-size:20px;font-weight:650}
.stat .k{color:var(--mute);font-size:12px;text-align:center;font-weight:500;line-height:1.3}
.stat .w{color:var(--ac)}
.stat .a.t,.stat .b.t{font-size:12.5px;font-weight:500;color:var(--mute);line-height:1.35}
@media(max-width:520px){.stat{grid-template-columns:1fr 92px 1fr}.stat .a,.stat .b{font-size:18px}}
.hgw{display:grid;grid-template-columns:28px 1fr 22px 1fr;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.hgw .n{font-weight:600;color:var(--mute);font-size:13px}
.hgw .c{display:flex;align-items:center;gap:8px}.hgw .c b{font-size:16px;min-width:30px}.hgw .c .bar{flex:1}
.hgw .m{text-align:center;color:var(--mute);font-weight:600;font-size:11px}
.cols3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
@media(max-width:700px){.cols3{grid-template-columns:1fr}}
.cols3 .c{background:var(--soft);border-radius:11px;padding:12px}
.cols3 h3{margin:0 0 8px;font-size:13.5px;font-weight:650}
.pr{display:flex;justify-content:space-between;align-items:center;font-size:14px;padding:4px 0;gap:8px}
.pr b{font-size:16px}
.pr.tot{border-top:1px solid var(--line);margin-top:4px;padding-top:8px}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.legend button{padding:4px 10px;font-size:12.5px;border-radius:999px;border-width:1.5px}
.legend button.on{font-weight:600;opacity:1}
.pop{position:fixed;z-index:50;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.45);padding:12px 14px;max-width:270px;font-size:13px;pointer-events:none}
.pop h4{margin:0 0 2px;font-size:14px}
.pop .sm{margin-bottom:6px}
.pop ul{margin:0;padding:0;list-style:none}
.pop li{padding:2px 0}
.pop .bn{color:var(--mute)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--mute);font-size:11px}
.chart .nmlab{font-size:11px;font-weight:600}
.player{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.player .sc{flex:1;min-width:140px;padding:0;accent-color:var(--ac)}
footer{text-align:center;color:var(--mute);font-size:12px;margin-top:28px;line-height:1.5}
/* compact league table */
.crow{display:block;border-bottom:1px solid var(--line);padding:11px 2px;cursor:pointer}
.crow:last-child{border-bottom:0}
.crow .m{display:grid;grid-template-columns:30px 1fr auto auto;gap:10px;align-items:center}
.crow .nmx{min-width:0}
.crow .nmx b{display:block;font-size:14.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow .nmx .sm{display:flex;gap:8px;align-items:center;margin-top:2px;white-space:nowrap}
.crow .num{text-align:right;min-width:42px}
.crow .num b{font-size:16px;font-weight:650;display:block;line-height:1.2}
.crow .num span{font-size:10.5px;color:var(--mute);letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.crow .more{display:none;margin:10px 0 2px 40px}
.crow.open .more{display:block}
.crow .mg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.crow .mg div{background:var(--soft);border-radius:9px;padding:8px 10px}
.crow .mg b{display:block;font-size:16px}.crow .mg span{font-size:10.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.crow .mini{height:16px}.crow .mini i{width:5px}
.crow .go{display:inline-block;margin-top:10px;font-size:13px;color:var(--ac);font-weight:600}
.lv{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;letter-spacing:.09em;color:var(--red);text-transform:uppercase;white-space:nowrap}
.lv i{width:7px;height:7px;border-radius:50%;background:var(--red);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(248,113,113,.55)}70%{box-shadow:0 0 0 7px rgba(248,113,113,0)}100%{box-shadow:0 0 0 0 rgba(248,113,113,0)}}
.lvt{font-size:12px;color:var(--mute);margin-top:8px;display:flex;gap:8px;align-items:center}
.crow.fl-up{animation:flup 1.6s ease-out}.crow.fl-dn{animation:fldn 1.6s ease-out}
@keyframes flup{0%{background:var(--grnbg)}100%{background:transparent}}
@keyframes fldn{0%{background:var(--redbg)}100%{background:transparent}}
.fade{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}}

/* ---- premium layer ---- */
:root{--ca:#4fd1a5;--cb:#a595ff;--r:18px}
:root[data-theme="light"]{--ca:#0f9d73;--cb:#6d5bd6}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--ca:#0f9d73;--cb:#6d5bd6}}
:root{--bg:#f5f6f8;--card:#ffffff;--line:#eceef2;--soft:#f3f4f7}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0c0f;--card:#12151a;--line:#1d2127;--soft:#181c22}}
:root[data-theme="dark"]{--bg:#0a0c0f;--card:#12151a;--line:#1d2127;--soft:#181c22}
body{font-size:15px;line-height:1.5}
header{border-bottom:0;padding:22px 0 12px;background:var(--bg)}
.brand{display:flex;align-items:center;gap:12px}
.mark{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:11px;background:var(--ink);color:var(--bg);font-weight:800;font-size:12.5px;letter-spacing:-.02em}
h1{margin:0;font-size:21px;font-weight:650;letter-spacing:-.025em}
.sub{margin-top:8px}
nav{background:var(--glass);border-bottom:1px solid var(--line)}
.card{border:0;border-radius:var(--r);padding:22px 20px;margin:12px 0}
@media(max-width:520px){.card{padding:18px 16px;border-radius:16px}}
.card h2{font-size:17px;font-weight:650;margin:0 0 4px}
.hint{font-size:13.5px;margin:0 0 16px}
.tiles{gap:0;background:var(--card);border-radius:var(--r);overflow:hidden;margin:12px 0}
.tile{background:none;border:0;border-radius:0;padding:18px 20px}
.tile+.tile{border-left:1px solid var(--line)}
@media(max-width:620px){.tiles{grid-template-columns:1fr}.tile+.tile{border-left:0;border-top:1px solid var(--line)}.tiles>.tile:nth-child(odd):last-child{grid-column:auto}}
.tile .l{font-size:12.5px;letter-spacing:0;text-transform:none;font-weight:500}
.tile .v{font-size:36px;font-weight:650;letter-spacing:-.04em;margin:3px 0 2px}
.tile .s{font-size:13.5px}
.dl .lab{font-size:12.5px;letter-spacing:0;text-transform:none;font-weight:500}
.dl .big{font-size:22px;font-weight:650;margin-top:2px}
.cd div{background:var(--soft);border:0;border-radius:12px}
.st .k{text-transform:none;letter-spacing:0;font-size:12.5px;font-weight:500}
.st{background:var(--soft)}
.st .v{font-size:24px;font-weight:650}
th{text-transform:none;letter-spacing:0;font-size:12.5px;font-weight:500}
.quirks{display:block;margin-top:14px}
.q{background:none;border-radius:0;padding:13px 0;border-top:1px solid var(--line);gap:14px}
.q b{text-transform:none;letter-spacing:0;font-size:13px;color:var(--ink);font-weight:600;margin-bottom:2px}
.q div{color:var(--mute);font-size:14px}
.q div b{color:var(--ink)}
.q .e{font-size:17px;opacity:.9}
.bdg{display:inline-block;object-fit:contain;vertical-align:middle;flex:none}
.bdg.tx{background:var(--soft);border-radius:50%;font-size:10px;font-weight:700;text-align:center;line-height:1;display:inline-flex;align-items:center;justify-content:center;color:var(--mute)}
.pn{display:inline-flex;align-items:center;gap:8px;min-width:0}
.pn b{font-weight:600}
.tn{font-weight:600}
.mg2{font-weight:400;color:var(--mute)}
.crow .nmx b{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.25}
#tbl td:nth-child(2){min-width:170px;white-space:normal}
.pl .tm{display:inline-flex;align-items:center;gap:3px}
.pl .tm .bdg{filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}
.pop .own{margin:4px 0 8px;font-size:13px;color:var(--mute);background:none;color:var(--mute);padding:0;display:block;border-radius:0}
.pop .own b{color:var(--ink)}
.pop h4{display:flex;align-items:center;gap:6px}
/* head to head */
.h2sel{align-items:center}.h2sel select{flex:1;min-width:0}.vsl{color:var(--mute);font-size:13px;font-weight:500}
.h2hero{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:stretch;padding:20px 14px}
.hs{text-align:center;padding:6px 6px 8px;border-radius:14px;min-width:0;position:relative}
.hs.a{--c:var(--ca)}.hs.b{--c:var(--cb)}
.hs::before{content:"";display:block;height:3px;border-radius:3px;background:var(--c);margin:0 auto 12px;width:36px;opacity:.55}
.hs.w::before{opacity:1;width:56px}
.hk{font-weight:650;font-size:15px;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.hm{font-size:12.5px;color:var(--mute);margin:2px 0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hn{font-size:46px;font-weight:650;letter-spacing:-.045em;line-height:1.05;color:var(--mute)}
.hs.w .hn{color:var(--c)}
.hp{font-size:12.5px;color:var(--mute);margin-top:4px}
.hv{display:flex;align-items:center;color:var(--mute);font-size:11.5px;font-weight:600;letter-spacing:.12em}
.wsplit{display:flex;gap:3px;height:34px;border-radius:10px;overflow:hidden}
.wsplit div{display:flex;align-items:center;justify-content:center;font-size:14px;min-width:30px}
.wa{background:var(--ca);color:#04140e}.wb{background:var(--cb);color:#0d0a26}.wd{background:var(--soft);color:var(--mute)}
:root[data-theme="light"] .wa,:root[data-theme="light"] .wb{color:#fff}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .wa,:root:not([data-theme="dark"]) .wb{color:#fff}}
.wleg{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--mute);margin-top:8px}
.mr{display:grid;grid-template-columns:48px 1fr 48px;gap:8px;align-items:center;padding:9px 0}
.mrv{font-size:17px;font-weight:600;color:var(--mute)}
.mrv.a{text-align:left}.mrv.b{text-align:right}
.mrv.a.w{color:var(--ca)}.mrv.b.w{color:var(--cb)}
.mrk{font-size:12.5px;color:var(--mute);text-align:center;margin-bottom:5px}
.mrb{display:grid;grid-template-columns:1fr 1fr;gap:3px}
.half{height:8px;background:var(--soft);border-radius:4px;display:flex;overflow:hidden}
.half.l{justify-content:flex-end}
.half i{display:block;height:100%;opacity:.4;border-radius:4px}
.half.l i{background:var(--ca)}.half.r i{background:var(--cb)}
.half i.w{opacity:1}
.mchips{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:start;padding-top:12px;border-top:1px solid var(--line);margin-top:6px}
.mchips .mrk{margin:2px 0 0}
.chp{display:inline-block;background:var(--soft);border-radius:999px;padding:2px 9px;font-size:12px;margin:0 4px 4px 0;color:var(--ink)}
.hscroll{overflow-x:auto}.hscroll .chart{max-width:none;min-width:100%}
.key{display:inline-block;width:9px;height:9px;border-radius:3px;margin:0 5px 0 8px;vertical-align:baseline}
.key.a{background:var(--ca)}.key.b{background:var(--cb)}
.dsplit{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.dl2,.dr2{display:flex;flex-direction:column;line-height:1.1;max-width:110px}
.dl2 b,.dr2 b{font-size:26px;font-weight:650;letter-spacing:-.03em}
.dl2 span,.dr2 span{font-size:12px;color:var(--mute);margin-top:3px}
.dr2{text-align:right}
.dl2 b{color:var(--ca)}.dr2 b{color:var(--cb)}
.dbar{position:relative;height:10px;background:var(--soft);border-radius:5px;display:flex}
.dbar::after{content:"";position:absolute;left:50%;top:-4px;bottom:-4px;width:1px;background:var(--mute);opacity:.6}
.dbar i{position:absolute;top:0;height:100%;border-radius:5px}
.dbar i.a{right:50%;background:var(--ca)}.dbar i.b{left:50%;background:var(--cb)}
.dnote{font-size:13.5px;color:var(--mute);margin:12px 0 16px}.dnote b{color:var(--ink)}
.cols3 .c{background:none;padding:0 0 0 12px;border-left:2px solid var(--line)}

.cols3{gap:18px}
.cols3 h3{display:flex;justify-content:space-between;font-size:13.5px;margin:0 0 6px;font-weight:600}
.cols3 h3 span{color:var(--mute);font-weight:500}
.pr2{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:14px;gap:8px;border-bottom:1px solid var(--line)}
.pr2:last-child{border-bottom:0}
.pr2 b{font-size:15px;font-weight:600}
.cb2{display:inline-block;background:var(--soft);color:var(--mute);font-size:10px;font-weight:700;border-radius:4px;padding:0 4px;margin-left:2px}
.card .tiles{background:var(--soft);margin:0 0 16px;border-radius:14px}
@media(max-width:620px){.tiles.c3{grid-template-columns:repeat(3,1fr)}.tiles.c3 .tile{padding:14px 12px}.tiles.c3 .tile+.tile{border-top:0;border-left:1px solid var(--line)}.tiles.c3 .v{font-size:22px}.tiles.c3 .l{font-size:12px}.tiles.c3 .s{font-size:12px}}

/* ---- v6 ---- */
.bdg{width:var(--s,18px);height:var(--s,18px);background-size:contain;background-repeat:no-repeat;background-position:center}
.tap{cursor:pointer}
.ink{color:var(--ink)}
tr.tap:hover td{background:var(--soft)}
.pie{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center}
@media(max-width:620px){.pie{grid-template-columns:1fr;justify-items:center}.pie .lgd{width:100%}}
.dnut{position:relative;flex:none}
.dnut svg{display:block;transform:none}

.dnut .dc b{font-size:26px;font-weight:650;letter-spacing:-.03em}
.dnut .dc span{font-size:11px;color:var(--mute);margin-top:2px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rings .dnut .dc b{font-size:17px}
.lg{border-top:1px solid var(--line);padding:9px 0;cursor:pointer}
.lg:first-child{border-top:0}

.lgo{display:none;margin:6px 0 0 20px}

.ring{display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center;background:var(--soft);border-radius:14px;padding:12px;cursor:pointer;min-width:0;transition:transform .12s}
.ring:hover{transform:translateY(-1px)}
.ring .rn{min-width:0;width:100%}.ring .rn .pn{justify-content:center;max-width:100%}.ring .rn .pn b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;max-width:100%}
.cl{display:grid;grid-template-columns:30px 1fr 64px;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line);cursor:pointer}

.clv{text-align:right;line-height:1.2}.clv b{font-size:17px;display:block}

.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:6px}
.rc{position:relative;overflow:hidden;border-radius:10px;background:var(--soft);padding:7px 4px;text-align:center;line-height:1.2}

.fxd{display:none;margin-top:12px;grid-template-columns:1fr 1fr;gap:14px}
.fx.open .fxd{display:grid}

.fxh{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:4px}
.fxp{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-top:1px solid var(--line);font-size:13.5px}
.fd{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:6px;font-size:11.5px;font-weight:700;color:#0b0d10;flex:none}
.fd.d1{background:#2fa66a;color:#fff}.fd.d2{background:#7bd88f}.fd.d3{background:#d6dae0}.fd.d4{background:#f4a259}.fd.d5{background:#e5484d;color:#fff}
.fdl{display:flex;gap:4px;margin:0 0 4px}
.ad{display:flex;gap:10px;align-items:center;justify-content:center;margin:22px 0 0;padding:12px 14px;border-radius:12px;background:var(--card);color:var(--ink);text-decoration:none;font-size:13.5px}
.ad-l{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:600}
/* animations (only inside .fade, so live refreshes and sorting stay still) */
@keyframes gx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes gy{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes dnk{from{stroke-dasharray:0 100}}
@keyframes popin{from{opacity:0;transform:scale(.7)}}
.fade .bar i,.fade .half i,.fade .dbar i,.fade .wsplit div{transform-origin:left;animation:gx .9s cubic-bezier(.2,.7,.2,1) both}
.fade .half.l i,.fade .dbar i.a{transform-origin:right}
.fade .gwstrip button,.fade .mb i{transform-origin:bottom;animation:gy .7s cubic-bezier(.2,.7,.2,1) both}
.fade .chart rect.col{transform-box:fill-box;transform-origin:bottom;animation:gy .8s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i)*28ms)}
.fade .dnut svg circle:not(:first-child){animation:dnk 1.1s cubic-bezier(.2,.7,.2,1) both}
.fade .pitch .pl{animation:popin .45s cubic-bezier(.2,.8,.2,1) both}
.fade .rc{animation:popin .4s both}
#sheet.go .mb i{transform-origin:bottom;animation:gy .7s cubic-bezier(.2,.7,.2,1) both}
#sheet.go .dnut svg circle:not(:first-child){animation:dnk 1.1s cubic-bezier(.2,.7,.2,1) both}
@media (prefers-reduced-motion:reduce){.fade *,#sheet *{animation:none!important}}

.fd{width:30px;height:30px;font-size:16px;border-radius:8px}

header{text-align:center;padding:30px 0 16px}
.brand{flex-direction:column;justify-content:center;gap:14px}
.mark{width:44px;height:44px;border-radius:13px;font-size:14px}
h1{font-family:"LoF Display","Poppins",-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",system-ui,sans-serif;font-weight:700;font-size:clamp(30px,7vw,48px);letter-spacing:-.025em;line-height:1.08}
.sub{text-align:center;margin-top:10px}

[data-pl],[data-tm],[data-mg]{cursor:pointer}
.ml,.pk,.tl{text-decoration:underline dotted;text-decoration-color:var(--mute);text-underline-offset:3px;text-decoration-thickness:1px}
.ml:hover,.pk:hover,.tl:hover,.pn[data-tm]:hover b,.pn[data-pl]:hover b{color:var(--ac);text-decoration-color:var(--ac)}
.hs[data-mg]:hover .hk{color:var(--ac)}
.forml{display:flex;gap:6px;margin-bottom:8px}
.fr{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:8px;font-size:13px;font-weight:700}
.fr.W{background:var(--grnbg);color:var(--grn)}.fr.L{background:var(--redbg);color:var(--red)}.fr.D{background:var(--soft);color:var(--mute)}

<header><div class="wrap">
<div class="brand"><span class="mark">LoF</span><h1 id="ttl">Stats</h1></div>
<div class="sub" id="upd"></div>
<div class="topbar">
 <div class="gwsel"><button id="prev" aria-label="Previous gameweek">‹</button><select id="gwsel" aria-label="Gameweek"></select><button id="next" aria-label="Next gameweek">›</button></div>
 <span id="lvslot"></span><span class="grow"></span>
 <button id="theme" class="ibtn" title="Switch theme" aria-label="Switch theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 3v18" /><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg></button>
</div></div></header>

<script>
const D=/*__DATA__*/null;
</script>
<script>
(function(){
'use strict';
const M=D.mgr,PL=D.players,PTS=D.pts,LAST=D.last;
const EV=D.ev||{},FIN=D.fin==null?LAST:D.fin;
const evi=g=>EV[g]||{f:1,x:0,p:0,d:[],b:[]};
const isProv=g=>!evi(g).f;
const isDbl=g=>(evi(g).d||[]).length>0;
const isBlank=g=>(evi(g).b||[]).length>0;
function gwNote(g){
 const e=evi(g);let h='';
 if(!e.f)h+=`<div class="note live"><b>⏳ Still in progress.</b> ${e.p} of ${e.x} matches played. Scores, ranks and the winner can still change, so treat everything here as provisional until FPL calls it final.</div>`;
 if(isDbl(g))h+=`<div class="note dbl"><b>✌️ Double gameweek.</b> ${esc(e.d.join(', '))} ${e.d.length>1?'play':'plays'} twice. Scores run higher than usual and big hauls are easier to come by, so don't judge this week against a normal one.</div>`;
 if(isBlank(g))h+=`<div class="note blank"><b>🕳️ Blank gameweek.</b> ${esc(e.b.join(', '))} ${e.b.length>1?'have':'has'} no match. Fewer players score, so low numbers are normal this week.</div>`;
 return h}
function gwTag(g){const e=evi(g);return (e.f?'':' · live')+(isDbl(g)?' · double':'')+(isBlank(g)?' · blank':'')}
const POS={1:'GK',2:'DEF',3:'MID',4:'FWD'};
const CHIPN={wildcard:'Wildcard',freehit:'Free Hit',bboost:'Bench Boost','3xc':'Triple Captain'};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const NEXT_ID=D.next?D.next.id:LAST;
const MAXGW=Math.max(LAST,...Object.keys(EV).map(Number));
const st={gw:LAST,fgw:Math.min(NEXT_ID,MAXGW),tab:'overview',mgr:M[0].id,a:null,b:null,sort:{k:'rank',rev:false},tview:'compact',open:null,rank:null,tz:null,rp:LAST,play:false,speed:1};
try{const t=localStorage.getItem('lof_tz');if(t)st.tz=t}catch(e){}
const TABS=[['overview','Overview'],['table','Table'],['totw','Best XI'],['squads','Squads'],['h2h','Head-to-head'],['fixtures','Fixtures']];
function readHash(){const p=new URLSearchParams(location.hash.slice(1));
 const g=+p.get('gw');if(g>=1&&g<=LAST)st.gw=g;
 const fg=+p.get('fgw');if(fg>=1&&fg<=MAXGW)st.fgw=fg;
 if(TABS.some(t=>t[0]===p.get('tab')))st.tab=p.get('tab');
 if(p.get('m')&&M.some(x=>String(x.id)===p.get('m')))st.mgr=+p.get('m')}
function liveBadge(){const el=document.getElementById('lvslot');if(!el)return;
 if(!isProv(LAST)){el.innerHTML='';return}
 el.innerHTML=`<span class="lv"><i></i>Live</span>`;
 const sub=$('#upd');const t=new Date(D.liveTs||D.updated);
 sub.textContent='Through Gameweek '+LAST+' (in progress) · '+((D.liveTs)?'live, updated ':'updated ')+t.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit',second:D.liveTs?'2-digit':undefined})}
function writeHash(){const p=new URLSearchParams();p.set('tab',st.tab);p.set('gw',st.gw);if(st.tab==='squads')p.set('m',st.mgr);if(st.tab==='fixtures')p.set('fgw',st.fgw);
 try{history.replaceState(null,'','#'+p)}catch(e){}}
readHash();
// ---------- derived data
const byId=Object.fromEntries(M.map(m=>[m.id,m]));
const net=(m,g)=>{const r=m.gw[g];return r?r[0]-r[1]:null};

  const eh=teamExp(by,f.h),ea=teamExp(by,f.a);
  const live=f.started&&!f.fin;
  const mid=(f.fin||live)&&f.hs!=null?`<b class="sc">${f.hs}–${f.as}</b>`:`<span class="sm">${f.ko?fxFmt(f.ko,{hour:'2-digit',minute:'2-digit',hour12:false}):'TBC'}</span>`;
  out+=`<div class="fx" data-fx="${f.h}-${f.a}"><div class="fxm"><div class="fxt r"><span class="pn" data-tm="${f.h}"><b>${esc(f.h)}</b>${badge(f.h,30)}</span><span class="fd d${f.hd}" title="Difficulty for ${esc(f.h)}">${f.hd}</span></div><div class="fxc">${mid}${live?'<span class="lv"><i></i>Live</span>':''}</div><div class="fxt"><span class="fd d${f.ad}" title="Difficulty for ${esc(f.a)}">${f.ad}</span><span class="pn" data-tm="${f.a}">${badge(f.a,30)}<b>${esc(f.a)}</b></span></div></div>
  <div class="fxo sm"><span>${eh.mgrs?`${eh.mgrs} manager${eh.mgrs>1?'s':''} · ${eh.players} player${eh.players>1?'s':''}`:'no league stake'}</span><span>${ea.mgrs?`${ea.mgrs} manager${ea.mgrs>1?'s':''} · ${ea.players} player${ea.players>1?'s':''}`:'no league stake'}</span></div>
  <div class="fxd">${side(f.h,eh)}${side(f.a,ea)}</div></div>`});
 out+='</div>';
 h+=`<div class="card" id="fxList"><h2>Matches</h2><p class="hint">The little numbers are FPL's difficulty rating (1 easiest, 5 hardest). Tap a match to see which of your league's players are in it.</p><div class="fdl"><span class="fd d1">1</span><span class="fd d2">2</span><span class="fd d3">3</span><span class="fd d4">4</span><span class="fd d5">5</span></div>${out}</div>`;
 return h;
}
// ---------- live updates
function applyLive(u){
 const g=LAST;const old={};M.forEach(m=>old[m.id]=m.gw[g]?net(m,g):null);
 M.forEach(m=>{const s=u.scores&&u.scores[m.id];if(!s||!m.gw[g])return;const prev=m.gw[g-1]?m.gw[g-1][4]:0;m.gw[g][0]=s[0];m.gw[g][1]=s[1];m.gw[g][4]=prev+s[0]-s[1]});
 Object.keys(u.pts||{}).forEach(k=>{PTS[g][k]=u.pts[k]});
 if(D.ev&&D.ev[g]&&u.p!=null)D.ev[g].p=u.p;
 RK[g]=ranksAt(g);D.liveTs=u.ts||Date.now();
 st.flash={};M.forEach(m=>{if(m.gw[g]&&old[m.id]!==net(m,g))st.flash[m.id]=net(m,g)>old[m.id]?'up':'dn'});
 if(st.tab!=='rank'&&st.tab!=='h2h'){const y=window.scrollY;render(false);window.scrollTo(0,y)}else liveBadge();
}
window.__lof={applyLive,M,PTS,LAST,D,render};
async function pollLive(){if(!D.livefn||!isProv(LAST)||document.hidden)return;
 try{const r=await fetch(D.livefn+'?gw='+LAST,{cache:'no-store'});if(r.ok)applyLive(await r.json())}catch(e){}}
if(D.livefn&&isProv(LAST)){setInterval(pollLive,60000);pollLive()}
// ---------- render
function render(anim){
 anim=anim!==false&&!NOANIM();
 clearInterval(timer);if(st.tab!=='rank')stopAnim();hidePop();
 syncGw();writeHash();liveBadge();
 document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===st.tab));
 const gsel=document.querySelector('.gwsel');if(gsel)gsel.style.display=st.tab==='fixtures'?'none':'';
 const app=$('#app');
 const v={overview,table:tableView,totw:totwView,squads,h2h,fixtures:fixturesView,rank:rankView}[st.tab]||overview;
 app.innerHTML=`<div class="${anim?'fade':'noa'}">`+(st.tab==='fixtures'?'':gwNote(st.tab==='rank'?LAST:st.gw))+v()+'</div>';
 if(anim)runCounts(app);
 if(st.tab==='overview'||st.tab==='totw')wireDeadline();
 app.querySelectorAll('tr[data-m]').forEach(r=>r.onclick=()=>goSquad(+r.dataset.m));
 app.querySelectorAll('.tile[data-go]').forEach(t=>t.onclick=()=>goSquad(+t.dataset.go));
 app.querySelectorAll('.cl[data-c]').forEach(r=>r.onclick=()=>goSquad(+r.dataset.c));
 const tv=$('#tview');if(tv)tv.onclick=e=>{const b=e.target.closest('button');if(b){st.tview=b.dataset.v;render(false)}};
 app.querySelectorAll('.crow').forEach(r=>r.onclick=e=>{const a=e.target.closest('a[data-sq]');if(a){e.preventDefault();goSquad(+a.dataset.sq);return}
  if(!r.closest('#app').querySelector('.more')){goSquad(+r.dataset.c);return}
  const id=+r.dataset.c;st.open=st.open===id?null:id;r.parentNode.querySelectorAll('.crow').forEach(x=>x.classList.toggle('open',+x.dataset.c===st.open))});
 if(st.flash){app.querySelectorAll('.crow[data-c]').forEach(r=>{const f=st.flash[r.dataset.c];if(f)r.classList.add('fl-'+f)});st.flash=null}
 const act=document.querySelector('#tabs button.on');if(act&&act.scrollIntoView)act.scrollIntoView({inline:'center',block:'nearest'});
 app.querySelectorAll('th[data-s]').forEach(t=>t.onclick=()=>{const k=t.dataset.s;if(st.sort.k===k)st.sort.rev=!st.sort.rev;else st.sort={k,rev:false};render(false)});
 const ss=$('#sortsel');if(ss)ss.onchange=()=>{st.sort={k:ss.value,rev:false};render(false)};
 const sr=$('#sortrev');if(sr)sr.onclick=()=>{st.sort.rev=!st.sort.rev;render(false)};
 const sm=$('#sm');if(sm)sm.onchange=()=>{st.mgr=+sm.value;render()};
 app.querySelectorAll('.gwstrip button').forEach(b=>b.onclick=()=>{st.gw=+b.dataset.g;render()});
 const ha=$('#ha'),hb=$('#hb');if(ha){ha.onchange=()=>{st.a=+ha.value;render()};hb.onchange=()=>{st.b=+hb.value;render()}}
 const fs=$('#fsel');if(fs){fs.onchange=()=>{st.fgw=+fs.value;render()};$('#fprev').disabled=st.fgw<=1;$('#fnext').disabled=st.fgw>=MAXGW;
  $('#fprev').onclick=()=>{if(st.fgw>1){st.fgw--;render()}};$('#fnext').onclick=()=>{if(st.fgw<MAXGW){st.fgw++;render()}};
  $('#ftz').onchange=e=>{st.tz=e.target.value;try{localStorage.setItem('lof_tz',st.tz)}catch(x){};render(false)};
  app.querySelectorAll('.fx').forEach(el=>el.onclick=e=>{if(e.target.closest('[data-pl]'))return;el.classList.toggle('open')})}
 if(st.tab==='totw')wirePop();
 if(st.tab==='rank')wireRank();
}
window.addEventListener('hashchange',()=>{readHash();render()});
window.__LOF={st,RK,xi,totw,gwSummary,seasonStats,net,tot,fmtDeadline};
render();
})();
</script>
