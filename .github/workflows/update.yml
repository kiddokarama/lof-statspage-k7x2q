name: Update stats site

on:
  schedule:
    - cron: "0 5 * * 3"   # every Wednesday 05:00 UTC
  workflow_dispatch:       # lets you run it by hand from the Actions tab

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch FPL data and build the page
        run: |
          python3 fetch.py data.json
          mkdir -p public
          python3 build.py public/index.html
      - name: Publish to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: npx --yes netlify-cli@latest deploy --dir=public --prod --site "$NETLIFY_SITE_ID"
